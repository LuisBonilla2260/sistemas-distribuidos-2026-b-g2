# Security gates proposed for dlc-clinical-api (clinical-service, Go).
# Boundary: api-gateway -> clinical-service. Stories: code-corhuila/dlc-docs#137, #138, #139.
name: security

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Dependency audit (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  authz-tests:
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Negative authorization tests (dlc-docs#137)
        run: go test ./internal/adapter/in/httpapi/ -run 'TestClinicalRecordAuthz|TestRejectedTokens|TestOpenRecordMapsDomainOutcomes' -v
